<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>JUN.</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

header {
  text-align: center;
  margin-bottom: 22px;
}

h1 {
  letter-spacing: 9px;
  font-size: 30px;
  margin: 0;
}

.sub {
  color: #777;
  font-size: 10px;
  letter-spacing: 4px;
  margin-top: 10px;
}

.player {
  position: relative;
  width: 100%;
  max-width: 390px;
  border-radius: 14px;
  overflow: hidden;
  background: #151515;
}

video {
  width: 100%;
  display: block;
  aspect-ratio: 9 / 16;
  object-fit: contain;
  background: black;
}

#sound {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: #242424;
  border: 1px solid #555;
  border-radius: 30px;
  color: white;
  padding: 13px 20px;
}

footer {
  color: #555;
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
  <h1>JUN.</h1>
  <div class="sub">VIDEO COLLECTION</div>
</header>

<div class="player">
  <video id="video" autoplay muted playsinline loop>
    <source
      src="./Arayy%20ko!%20%23malupiton%20%23funny.mp4"
      type="video/mp4">
  </video>

  <button id="sound">TAP FOR SOUND</button>
</div>

<footer>© JUN.</footer>

<script>
const video = document.getElementById("video");
const sound = document.getElementById("sound");

video.play().catch(() => {});

sound.addEventListener("click", async () => {
  video.muted = false;

  try {
    await video.play();
    sound.style.display = "none";
  } catch {
    sound.textContent = "TAP TO PLAY";
  }
});
</script>

</body>
</html>
