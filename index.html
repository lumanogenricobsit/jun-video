
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>JUN. — Meme Studio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px 12px;
}

header {
  text-align: center;
  margin-bottom: 26px;
}

.logo {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: 12px;
  margin-left: 12px;
  background: linear-gradient(
    135deg, #ffffff, #929292
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  color: #777;
  font-size: 10px;
  letter-spacing: 5px;
  margin-top: 9px;
}

.line {
  width: 35px;
  height: 2px;
  background: #777;
  margin: 15px auto 0;
}

.player {
  position: relative;
  width: 100%;
  max-width: 520px;
  border-radius: 18px;
  overflow: hidden;
  background: #151515;
  box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

video {
  width: 100%;
  display: block;
  aspect-ratio: 9 / 16;
  object-fit: cover;
  object-position: center;
  background: black;
}

#sound {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,20,20,.85);
  border: 1px solid #777;
  border-radius: 30px;
  color: white;
  padding: 13px 22px;
  font-size: 12px;
  white-space: nowrap;
}

.details {
  width: 100%;
  max-width: 520px;
  display: flex;
  justify-content: space-between;
  margin-top: 18px;
  color: #777;
  font-size: 10px;
  letter-spacing: 2px;
}

footer {
  color: #555;
  font-size: 10px;
  letter-spacing: 4px;
  margin-top: 35px;
}

@media(max-width: 480px) {
  body {
    padding: 20px 10px;
  }

  .logo {
    font-size: 38px;
  }

  .player {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">JUN.</div>
  <div class="subtitle">MEME STUDIO</div>
  <div class="line"></div>
</header>

<div class="player">

  <video id="video"
    autoplay
    muted
    playsinline
    loop
    preload="auto">

    <source
      src="./Arayy%20ko!%20%23malupiton%20%23funny.mp4"
      type="video/mp4">

  </video>

  <button id="sound">🔊 TAP FOR SOUND</button>

</div>

<div class="details">
  <span>JUN. ORIGINAL VIDEO</span>
  <span>VOL. 001</span>
</div>

<footer>© JUN. ALL RIGHTS RESERVED</footer>

<script>
const video = document.getElementById("video");
const sound = document.getElementById("sound");

video.play().catch(() => {});

sound.addEventListener("click", async () => {
  video.muted = false;

  try {
    await video.play();
    sound.style.display = "none";
  } catch {
    sound.textContent = "TAP TO PLAY";
  }
});
</script>

</body>
</html>
