
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>JUN. | Private Video</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

header {
  text-align: center;
  margin-bottom: 24px;
}

h1 {
  letter-spacing: 9px;
  font-size: 30px;
  margin: 0;
}

.subtitle {
  color: #777;
  font-size: 10px;
  letter-spacing: 4px;
  margin-top: 10px;
}

.player {
  position: relative;
  width: 100%;
  max-width: 390px;
  background: #151515;
  border-radius: 15px;
  overflow: hidden;
}

video {
  display: block;
  width: 100%;
  aspect-ratio: 9 / 16;
  object-fit: contain;
  background: #000;
}

#sound {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  border: 1px solid #555;
  border-radius: 30px;
  background: rgba(20,20,20,.85);
  color: white;
  padding: 13px 22px;
  font-size: 13px;
  cursor: pointer;
}

footer {
  color: #555;
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
  <h1>JUN.</h1>
  <div class="subtitle">VIDEO COLLECTION</div>
</header>

<div class="player">
  <video id="myVideo"
    autoplay
    muted
    playsinline
    loop
    preload="auto">
    <source src="Arayy%20ko!%20%23malupiton%20%23funny.mp4"
      type="video/mp4">
  </video>

  <button id="sound">🔊 TAP FOR SOUND</button>
</div>

<footer>© JUN. ALL RIGHTS RESERVED</footer>

<script>
const video = document.getElementById("myVideo");
const sound = document.getElementById("sound");

// Attempt autoplay with sound first.
// If the browser blocks it, autoplay muted.
video.muted = false;

video.play().catch(() => {
  video.muted = true;
  video.play().catch(() => {});
});

sound.addEventListener("click", async () => {
  video.muted = false;

  try {
    await video.play();
    sound.style.display = "none";
  } catch (error) {
    video.muted = true;
    sound.textContent = "TAP TO PLAY WITH SOUND";
  }
});
</script>

</body>
</html>
